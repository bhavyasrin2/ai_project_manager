services:
  - type: web
    name: ai-project-manager-api
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    disk:
      name: sqlite-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: DB_PATH
        value: /data/life_os.db
      - key: GOOGLE_TOKEN_PATH
        value: /etc/secrets/token.json
      # Set these manually in Render dashboard (sensitive):
      # YOUR_EMAIL
      # ANTHROPIC_API_KEY
      # ALLOWED_ORIGINS  →  https://your-app.vercel.app
